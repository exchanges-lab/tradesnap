services:
  tradesnap:
    build: .
    image: tradesnap:latest
    container_name: tradesnap
    env_file:
      - .env
    ports:
      - "8003:8003"
    volumes:
      - ./target/chrome_profile:/app/target/chrome_profile
    networks:
      - cycle
    restart: unless-stopped

networks:
  cycle:
    external: true
